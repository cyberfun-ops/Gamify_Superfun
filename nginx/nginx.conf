# ── Worker processes ──────────────────────────────────────────────────────────
worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Required for correct Content-Type on JS/CSS/images
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Upstream: 3 auth API instances ────────────────────────────────────────
    upstream gamify_backend {
        least_conn;
        server api_1:3000 max_fails=3 fail_timeout=30s;
        server api_2:3000 max_fails=3 fail_timeout=30s;
        server api_3:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── Logging ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;
    client_max_body_size 16k;

    # Compress text assets — JS/CSS bundles can be 200-400kb
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1000;
    gzip_types        text/plain text/css application/json
                      application/javascript text/javascript
                      image/svg+xml text/xml application/xml;

    # ── Server block ───────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Common proxy headers — tell Express the real client IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ── Auth API ───────────────────────────────────────────────────────────
        # IMPORTANT: no CORS headers here — Express cors() already sets them.
        # Duplicate headers cause browser preflight failures.
        location /auth/ {
            proxy_pass http://gamify_backend;
        }

        # ── Health check ───────────────────────────────────────────────────────
        location /health {
            proxy_pass http://gamify_backend;
        }

        # ── Game engine REST ───────────────────────────────────────────────────
        location /api/game/ {
            proxy_pass http://game_engine:4000;
        }

        # ── Transaction server (deposit UTR + SMS webhook) ─────────────────────
        location /api/txn/ {
            proxy_pass http://transaction_server:5001;
        }

        # ── Socket.io WebSocket ────────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass         http://game_engine:4000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Static assets — cache aggressively (filenames include content hashes) ──
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root       /usr/share/nginx/html;
            expires    1y;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }

        # ── index.html — never cache so browser always gets latest version ──────
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma         "no-cache";
            expires    0;
        }

        # ── React SPA — fallback to index.html for client-side routing ──────────
        location / {
            root      /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Admin dashboard ────────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # All traffic (API + React SPA) goes to admin_service
        location / {
            proxy_pass http://admin_service:5000;
        }
    }
}
